name: ci

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.8"
      - name: Ruff lint (correctness rules)
        run: ruff check src tests build_scripts
      - name: Ruff format check
        run: ruff format --check src tests build_scripts

  test:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: src/requirements.txt
      - name: Install dependencies (no desktop GUI packages on CI)
        shell: bash
        run: |
          python -m pip install --upgrade pip
          grep -v -E '^(pywebview|pystray|pillow)' src/requirements.txt > /tmp/req-ci.txt || cp src/requirements.txt /tmp/req-ci.txt
          pip install -r /tmp/req-ci.txt
      - name: Run tests
        run: python -m pytest tests -q
      - name: Fail if tests modified tracked files
        shell: bash
        run: git diff --exit-code --stat

  security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - name: Audit dependencies for known CVEs
        run: pip-audit -r src/requirements.txt --progress-spinner off

      - name: Scan for newly introduced hard-coded secrets
        run: |
          pip install detect-secrets
          git ls-files -z | xargs -0 detect-secrets-hook --baseline .secrets.baseline
        # Fails only on a secret that is NOT already in .secrets.baseline. The baselined
        # entries are alembic revision ids, synthetic protocol test vectors, test fixtures
        # and the deliberate legacy-password deny-list entry - all reviewed, none live.
        # To accept a new finding deliberately, re-run `detect-secrets scan` and commit.
