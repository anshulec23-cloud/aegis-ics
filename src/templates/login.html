<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aegis SCADA - Operator Authentication</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --scada-bg: #070a0f;
            --scada-panel: #0d131f;
            --scada-border: #1a2638;
            --scada-accent: #0284c7;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--scada-bg);
            color: #e2e8f0;
        }
        .apple-blur {
            background: var(--scada-panel);
            border: 1px solid var(--scada-border);
            border-radius: 8px !important;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.6);
        }
        .apple-border {
            border: 1px solid var(--scada-border);
        }
        .apple-input {
            background-color: #080c14;
            border: 1px solid var(--scada-border);
            border-radius: 6px;
            color: #f1f5f9;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            transition: border-color 0.15s ease-in-out;
        }
        .apple-input:focus {
            border-color: #38bdf8;
            background-color: #0c121d;
            outline: none;
            box-shadow: 0 0 0 1px #38bdf8;
        }
        .apple-btn {
            background-color: #1e293b;
            color: #f8fafc;
            border: 1px solid #334155;
            border-radius: 6px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-weight: 600;
            transition: all 0.15s ease;
        }
        .apple-btn:hover {
            background-color: #334155;
            border-color: #475569;
        }
        .apple-btn:active {
            background-color: #0f172a;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4 select-none">
    <div class="w-full max-w-md apple-blur rounded p-8 shadow-2xl">
        <div class="text-center mb-8 border-b border-[#1a2638] pb-6">
            <div class="inline-flex items-center gap-2 px-2.5 py-1 rounded bg-sky-500/10 border border-sky-500/30 text-sky-400 text-[10px] font-mono mb-3">
                <span class="w-1.5 h-1.5 rounded-full bg-sky-400"></span>
                NIST SP 800-82 REV 3 OT CONTROL
            </div>
            <h1 class="text-2xl font-bold tracking-tight text-white font-mono">Aegis SCADA Terminal</h1>
            <p class="text-xs text-slate-400 mt-1 font-mono">v2.5.0 // Operator Gateway Access</p>
        </div>
        
        {% if error %}
        <div class="bg-red-500/10 border border-red-500/30 text-red-200 text-xs px-4 py-3 rounded-lg mb-6 text-center font-light">
            {{ error }}
        </div>
        {% endif %}
        
        <form action="/login" method="POST" class="space-y-6">
            <!-- CSRF Token -->
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-[#86868b] mb-2" for="username">Operator ID</label>
                <input class="w-full apple-input rounded-lg px-4 py-3 text-sm" type="text" id="username" name="username" placeholder="Enter operator name" required autocomplete="username">
            </div>
            
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-[#86868b] mb-2" for="password">Access Token</label>
                <input class="w-full apple-input rounded-lg px-4 py-3 text-sm" type="password" id="password" name="password" placeholder="Enter password" required autocomplete="current-password">
            </div>
            
            <div class="border-t border-white/5 pt-4">
                <div class="flex items-center justify-between mb-2">
                    <label class="block text-xs font-semibold uppercase tracking-wider text-[#86868b]">Terminal Location Service</label>
                    <span id="loc-status-pill" class="text-[10px] font-mono px-2 py-0.5 rounded bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">HARDWARE GPS SYNCED</span>
                </div>
                <div class="p-3 bg-white/[0.03] border border-white/10 rounded-xl space-y-1">
                    <div class="flex justify-between text-xs">
                        <span class="text-[#86868b]">Coordinates:</span>
                        <span id="disp-coords" class="font-mono text-white text-[11px]">Lat 37.77490, Lon -122.41940</span>
                    </div>
                    <div class="flex justify-between text-xs">
                        <span class="text-[#86868b]">Plant Sector:</span>
                        <span id="disp-sector" class="font-mono text-white text-[11px]">Control Room Grid H-01 (Elev: 18.5m)</span>
                    </div>
                </div>
                <input type="hidden" id="location_coords" name="location_coords" value="Lat: 37.77490, Lon: -122.41940, Elev: 18.5m [Grid H-01]">
                <input type="hidden" id="latitude" name="latitude" value="37.77490">
                <input type="hidden" id="longitude" name="longitude" value="-122.41940">
                <input type="hidden" id="elevation" name="elevation" value="18.5">
            </div>
            
            <button class="w-full apple-btn py-3 rounded-lg text-sm tracking-wide shadow-md mt-2" type="submit">
                Access Terminal
            </button>
        </form>
    </div>

    <script>
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    const lat = pos.coords.latitude.toFixed(5);
                    const lon = pos.coords.longitude.toFixed(5);
                    const alt = pos.coords.altitude ? pos.coords.altitude.toFixed(1) + 'm' : '18.5m';
                    document.getElementById('latitude').value = lat;
                    document.getElementById('longitude').value = lon;
                    document.getElementById('location_coords').value = `Lat: ${lat}, Lon: ${lon}, Elev: ${alt} [Terminal GPS]`;
                    document.getElementById('disp-coords').innerText = `Lat ${lat}, Lon ${lon}`;
                    document.getElementById('disp-sector').innerText = `Live Device GPS (Elev: ${alt})`;
                    document.getElementById('loc-status-pill').innerText = 'BROWSER GPS SYNCED';
                },
                (err) => {
                    console.log('Using edge hardware GPS fallback:', err.message);
                },
                { timeout: 3000 }
            );
        }
    </script>
</body>
</html>
