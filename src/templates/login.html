<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aegis ICS — Operator Sign In</title>
    <!-- Offline Air-Gapped Vendor Styles -->
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/tailwind.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='xp.css') }}">
    <style>
        /* Sizing only — colours come from xp.css (.login-card = XP window). */
        .login-card { max-width: 420px; width: 100%; }
    </style>
</head>
<body class="theme-green flex items-center justify-center min-h-screen p-4 select-none">

    <div class="login-card p-6 md:p-8 space-y-6">
        <!-- Header -->
        <div class="border-b pb-5 text-center space-y-2">
            <div class="inline-flex items-center gap-2 px-2.5 py-1 rounded bg-blue-500/10 border border-blue-500/30 text-blue-400 text-[11px] tracking-wide uppercase">
                <span class="w-2 h-2 rounded-full bg-blue-400"></span>
                Aegis Industrial Control System
            </div>
            <h1 class="text-lg font-bold tracking-tight text-white">
                Operator Sign In
            </h1>
            <div class="text-[11px] text-slate-400 pt-1">
                Secure SCADA Supervisory Console
            </div>
        </div>

        {% if error %}
        <div class="p-3 bg-red-500/10 border border-red-500/30 text-red-400 text-xs text-center rounded">
            {{ error }}
        </div>
        {% endif %}

        <form action="/login" method="POST" class="space-y-4">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="space-y-1.5">
                <label class="block text-xs text-slate-300 tracking-wide" for="username">Username</label>
                <input class="subway-input w-full" type="text" id="username" name="username" placeholder="admin" required autocomplete="username" autofocus>
            </div>

            <div class="space-y-1.5">
                <label class="block text-xs text-slate-300 tracking-wide" for="password">Password</label>
                <input class="subway-input w-full" type="password" id="password" name="password" placeholder="Enter password" required autocomplete="current-password">
            </div>

            <!-- Control station identity (recorded with the sign-in for the audit trail). -->
            <div class="p-3 bg-[#050608] border border-[#1c2333] rounded space-y-1 text-[11px]">
                <div class="flex justify-between text-slate-400">
                    <span>Control station:</span>
                    <span class="text-white font-semibold">Central Station Alpha</span>
                </div>
                <div class="flex justify-between text-slate-400">
                    <span>Location:</span>
                    <span class="text-slate-300">Lat 37.7749, Lon -122.4194</span>
                </div>
                <input type="hidden" id="location_coords" name="location_coords" value="Lat: 37.77490, Lon: -122.41940, Elev: 18.5m [Grid H-01]">
                <input type="hidden" id="latitude" name="latitude" value="37.77490">
                <input type="hidden" id="longitude" name="longitude" value="-122.41940">
                <input type="hidden" id="elevation" name="elevation" value="18.5">
            </div>

            <button class="w-full subway-btn subway-btn-primary py-3 text-xs tracking-wide font-bold" type="submit">
                Sign In &rarr;
            </button>
        </form>

        <!-- Footer -->
        <div class="pt-3 border-t flex items-center justify-between text-[11px] text-slate-500">
            <span>Aegis ICS</span>
            <span class="text-slate-400">Secure Operator Console</span>
        </div>
    </div>

</body>
</html>
