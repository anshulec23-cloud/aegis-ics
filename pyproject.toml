[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-ics"
description = "Zero-trust security gateway and physical safety enforcer for industrial control systems (research prototype)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dynamic = ["version"]
dependencies = [
    "Flask>=3.1.3,<4",
    "Werkzeug>=3.1,<4",
    "Flask-Limiter>=3.5,<5",
    "SQLAlchemy>=2.0.31,<2.2",
    "alembic>=1.13.2,<2",
    "bleach>=6.1,<7",
    "reportlab>=4.2,<6",
    "pyserial>=3.5,<4",
    "requests>=2.34.0,<3",
    "cryptography>=50.0.0",
    "numpy>=1.26,<3",
    # Pinned to the minor version that produced src/model/rf_model.pkl (pickles are not portable across releases).
    "scikit-learn>=1.9,<1.10",
]

[project.optional-dependencies]
desktop = ["pywebview>=6.2.1", "pystray>=0.19", "pillow>=10"]
ml = ["torch>=2.2"]
dev = ["pytest>=8", "pypdf>=5.0.0", "ruff>=0.8", "pre-commit>=3.7"]

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = [
    "version", "app", "main", "database", "security", "serial_gateway", "trust_engine",
    "safety_enforcer", "neural_policy", "train_model", "analytics", "reporting", "tray", "updater",
    "device_keys", "bootstrap",
]

[tool.setuptools.dynamic]
version = { attr = "version.__version__" }

# ---------------------------------------------------------------- tooling ---

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    # rf_model.pkl is loaded across sklearn patch releases; tracked in the restructure plan (P4.1).
    "ignore::sklearn.exceptions.InconsistentVersionWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["src/alembic/versions", "build", "dist"]

[tool.ruff.lint]
# Phase 0: only correctness rules (syntax errors, undefined names, bad comparisons).
# The rule set is widened in Phase 3 once modules are split (see docs/08-roadmap/RESTRUCTURE_PLAN.md).
select = ["E9", "F63", "F7", "F82"]

[tool.ruff.format]
quote-style = "preserve"
